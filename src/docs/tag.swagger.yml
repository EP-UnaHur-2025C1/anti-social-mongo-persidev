openapi: 3.0.0
info:
  title: RED ANTISOCIAL PERSIDEV
  version: "1.0.0"
  description: API para la red antisocial de PERSIDEV
servers:
  url: "http://localhost:3001"
  description: Servidor local
components: # Aca definen el esquema de los objetos, si incluye otra tabla como en este caso images lo ponen como el ejemplo
  schemas:
    Tag:
      type: object
      properties:
        UserId:
          type: integer
          example: 1
          description: Id de la etiqueta.
        description:
          type: string
          example: "EstiquetaDePrueba"
          description: Descripcion de la etiqueta.
        
#-----------------------------------------------------------------
tags:
  - name: Tag
    description: Peticiones para realizar sobre tag

paths: # Aca definen las rutas
  /tags:
    get:
      tags:
        - Tag
      summary: Retorna todas las etiquetas.
      description: Obtener un array con todas las etiquetas disponibles.
      operationId: getTags
      
      responses:
        "200":
          description: Operacion realizada.
        "404":
          description: No se encontraron tags.
        "500":
          description: Error en el servidor al solicitar los tag.

    post:
      tags:
        - Tag
      summary: Permite crear un tag.
      description: Permite crear un tag a la base de datos y retornando el tag agregado.
      operationId: createTag
      requestBody:
        description: Crea una etiqueta
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tag"
        required: true
      responses:
        "200":
          description: Operacion realizada.
        "400":
          description: Error en la entrada de datos.
        "404":
          description: No se encontraron tag.
        "500":
          description: Error en el servidor al solicitar los tag.

  /tags/id:
    get:
      tags:
        - Tag
      summary: Retorna un tag por su numero de id.
      description: Obtener un tag por su id.
      operationId: getTagById
      parameters:
        - name: id
          in: path
          required: true
          description: Id del tag a buscar.
          schema:
            type: integer
      responses:
        "200":
          description: Operacion realizada.
        "404":
          description: No se encontro el tag.
        "500":
          description: Error en el servidor al solicitar el tag.

    put:
      tags:
        - Tag
      summary: Permite actualizar un tag por su id.
      description: Permite actualizar un tag a la base de datos retornando el tag actualizado.
      operationId: updateTagById
      parameters:
        - name: id
          in: path
          required: true
          description: Id del tag a actualizar.
          schema:
            type: integer
      requestBody:
        description: Actualiza un tag
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tag"
        required: true
      responses:
        "200":
          description: Operacion realizada.
        "400":
          description: Error en la entrada de datos.
        "404":
          description: No se encontro el tag.
        "500":
          description: Error en el servidor al solicitar el tag.

    delete:
      tags:
        - Tag
      summary: Permite eliminar un tag por su id.
      description: Permite eliminar un tag de la base de datos retornando el tag eliminado.
      operationId: deleteTagById
      parameters:
        - name: id
          in: path
          required: true
          description: Id del tag a eliminar.
          schema:
            type: integer
      responses:
        "200":
          description: Operacion realizada.
        "400":
          description: Error en la entrada de datos.
        "404":
          description: No se encontro el tag.
        "500":
          description: Error en el servidor al solicitar el tag.
        
  /tags/id/posts:
    get:
      tags:
        - Tag
      summary: Retorna todas los posts de una etiqueta.
      description: Obtener un array con todos los posts que tienen asociada una etiquetas segun su id.
      operationId: verPosts
      parameters:
        - name: id
          in: path
          required: true
          description: Id de la etiqueta a buscar sus posts.
          schema:
            type: integer
      responses:
        "200":
          description: Operacion realizada.
        "400":
          description: Error en la entrada de datos.
        "404":
          description: No se encontraron posteos del tag.
        "500":
          description: Error en el servidor al solicitar posteos.
    